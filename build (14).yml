                } catch (Exception e) {}
              }).start();
              JSObject r = new JSObject(); r.put("ip", ip()); c.resolve(r);
            }

            @PluginMethod public void wifiJoin(PluginCall c) {
              final String t = c.getString("target");
              new Thread(() -> {
                try {
                  String host = t;
                  if (!t.contains(".")) {
                    WifiManager wm = (WifiManager) getContext().getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                    WifiManager.MulticastLock ml = wm.createMulticastLock("mench"); ml.acquire();
                    DatagramSocket d = new DatagramSocket(null); d.setReuseAddress(true); d.bind(new InetSocketAddress(45679)); d.setSoTimeout(1500);
                    host = null; long end = System.currentTimeMillis() + 8000; byte[] b = new byte[64];
                    while (host == null && System.currentTimeMillis() < end) {
                      DatagramPacket p = new DatagramPacket(b, b.length);
                      try { d.receive(p); } catch (SocketTimeoutException e) { continue; }
