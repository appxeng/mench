                } catch (Exception e) { c.reject("fail"); }
              }).start();
            }

            @PluginMethod public void send(PluginCall c) {
              PrintWriter p = w.get(c.getString("id"));
              if (p != null) synchronized (p) { p.println(c.getString("msg")); p.flush(); }
              c.resolve();
            }
