          package com.hasan.mench;
          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.bluetooth.*;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.*;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.*;
          import java.net.*;
          import java.util.*;
          import java.util.concurrent.ConcurrentHashMap;

          @SuppressLint("MissingPermission")
          @CapacitorPlugin(name = "BtLink")
          public class BtLink extends Plugin {
            static final UUID U = UUID.fromString("8a6f1d3e-5b7c-4e2a-9c1d-0f3b6a7e2c11");
            BluetoothAdapter ad = BluetoothAdapter.getDefaultAdapter();
            Map<String, PrintWriter> w = new ConcurrentHashMap<>();
            int n = 0;

            boolean ok(PluginCall c) {
              if (ad == null || !ad.isEnabled()) { c.reject("off"); return false; }
              if (Build.VERSION.SDK_INT >= 31 && ContextCompat.checkSelfPermission(getContext(), Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                ActivityCompat.requestPermissions(getActivity(), new String[]{Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.BLUETOOTH_SCAN}, 77);
                c.reject("perm"); return false;
              }
              return true;
            }

            synchronized String reg(final InputStream in, OutputStream out) throws IOException {
              final String id = "b" + (++n);
              w.put(id, new PrintWriter(new OutputStreamWriter(out, "UTF-8")));
              JSObject o = new JSObject(); o.put("id", id); notifyListeners("conn", o);
              new Thread(() -> {
                try {
                  BufferedReader r = new BufferedReader(new InputStreamReader(in, "UTF-8"));
                  String l;
                  while ((l = r.readLine()) != null) { JSObject d = new JSObject(); d.put("id", id); d.put("msg", l); notifyListeners("data", d); }
                } catch (Exception e) {}
              }).start();
              return id;
            }

            @PluginMethod public void paired(PluginCall c) {
              if (!ok(c)) return;
              JSArray a = new JSArray();
              for (BluetoothDevice d : ad.getBondedDevices()) { JSObject o = new JSObject(); o.put("name", d.getName()); o.put("addr", d.getAddress()); a.put(o); }
              JSObject r = new JSObject(); r.put("list", a); c.resolve(r);
            }

            @PluginMethod public void listen(PluginCall c) {
              if (!ok(c)) return;
              new Thread(() -> {
                try { BluetoothServerSocket ss = ad.listenUsingRfcommWithServiceRecord("mench", U); while (true) { BluetoothSocket s = ss.accept(); reg(s.getInputStream(), s.getOutputStream()); } } catch (Exception e) {}
              }).start();
              c.resolve();
            }

            @PluginMethod public void connect(PluginCall c) {
              if (!ok(c)) return;
              final String a = c.getString("addr");
              new Thread(() -> {
                try {
                  ad.cancelDiscovery();
                  BluetoothSocket s = ad.getRemoteDevice(a).createRfcommSocketToServiceRecord(U);
                  s.connect();
                  JSObject r = new JSObject(); r.put("id", reg(s.getInputStream(), s.getOutputStream())); c.resolve(r);
                } catch (Exception e) { c.reject("fail"); }
              }).start();
            }

            String ip() {
              StringBuilder sb = new StringBuilder();
              try {
                for (NetworkInterface i : Collections.list(NetworkInterface.getNetworkInterfaces()))
                  for (InetAddress a : Collections.list(i.getInetAddresses()))
                    if (a instanceof Inet4Address && !a.isLoopbackAddress()) sb.append(sb.length() > 0 ? " / " : "").append(a.getHostAddress());
              } catch (Exception e) {}
              return sb.toString();
            }

            @PluginMethod public void wifiHost(PluginCall c) {
              final String code = c.getString("code");
              new Thread(() -> {
                try { ServerSocket ss = new ServerSocket(45678); while (true) { Socket s = ss.accept(); s.setTcpNoDelay(true); reg(s.getInputStream(), s.getOutputStream()); } } catch (Exception e) {}
              }).start();
              new Thread(() -> {
                try {
                  DatagramSocket d = new DatagramSocket(); d.setBroadcast(true);
                  byte[] b = ("MENCH:" + code).getBytes("UTF-8");
                  while (true) { d.send(new DatagramPacket(b, b.length, InetAddress.getByName("255.255.255.255"), 45679)); Thread.sleep(1000); }
                } catch (Exception e) {}
              }).start();
              JSObject r = new JSObject(); r.put("ip", ip()); c.resolve(r);
            }

            @PluginMethod public void wifiJoin(PluginCall c) {
              final String t = c.getString("target");
              new Thread(() -> {
                try {
                  String host = t;
                  if (!t.contains(".")) {
                    WifiManager wm = (WifiManager) getContext().getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                    WifiManager.MulticastLock ml = wm.createMulticastLock("mench"); ml.acquire();
                    DatagramSocket d = new DatagramSocket(null); d.setReuseAddress(true); d.bind(new InetSocketAddress(45679)); d.setSoTimeout(1500);
                    host = null; long end = System.currentTimeMillis() + 8000; byte[] b = new byte[64];
                    while (host == null && System.currentTimeMillis() < end) {
                      DatagramPacket p = new DatagramPacket(b, b.length);
                      try { d.receive(p); } catch (SocketTimeoutException e) { continue; }
                      if (new String(p.getData(), 0, p.getLength(), "UTF-8").equals("MENCH:" + t)) host = p.getAddress().getHostAddress();
                    }
                    d.close(); ml.release();
                  }
                  if (host == null) { c.reject("nf"); return; }
                  Socket s = new Socket(); s.connect(new InetSocketAddress(host, 45678), 5000); s.setTcpNoDelay(true);
                  JSObject r = new JSObject(); r.put("id", reg(s.getInputStream(), s.getOutputStream())); c.resolve(r);
                } catch (Exception e) { c.reject("fail"); }
              }).start();
            }

            @PluginMethod public void send(PluginCall c) {
              PrintWriter p = w.get(c.getString("id"));
              if (p != null) synchronized (p) { p.println(c.getString("msg")); p.flush(); }
              c.resolve();
            }
          }
          E
          cat > $D/MainActivity.java <<'E'
          package com.hasan.mench;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) { registerPlugin(BtLink.class); super.onCreate(b); }
          }
          E
          sed -i 's|<application|<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/><uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/><uses-permission android:name="android.permission.BLUETOOTH_SCAN"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/><uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/><application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
